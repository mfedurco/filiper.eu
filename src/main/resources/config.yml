# Výprava – nastavenia
daily-quest-count: 3
weekly-quest-count: 2
longterm-quest-count: 2
shared-quest-count: 2
party-quest-count: 1
timezone: Europe/Bratislava

# Vlastný reťazec tohto Minecraft servera. Povinné, keď je database.enabled: true.
# Každé nasadenie má iný reťazec, napríklad test, survival, creative. Predvolená hodnota nie je.
# Prázdne server-id odmietne zápis.
server-id: ""

# Kľúč servera z portálu. Keď je vyplnený, plugin ide cez HTTPS portál a jdbc-url sa nečíta.
# Heslo do gitu nedávajte.
server-key: ""

# Portál, napríklad https://vyprava.filiper.eu. Povinné spolu so server-key.
portal-url: ""

# Priamy Postgres, len keď server-key nie je nastavený. Heslo do gitu nedávajte.
# Prázdna jdbc-url znamená DATABASE_URL_UNPOOLED alebo .env.local.
database:
  enabled: false
  jdbc-url: ""

# Jazyk správ pre hráča, ktorý ešte nemá uloženú voľbu a jeho Minecraft locale nie je sk*.
# sk alebo en.
language:
  default: sk

# HTTP API pre starší web sync. Nový portál používa server-key.
web:
  enabled: false
  bind: 127.0.0.1
  port: 8765
  # Povinný pri zapnutí starého API. Bez tokenu sa API nespustí.
  api-token: ""
  # Voliteľný presný web origin pre CORS, napríklad https://vyprava.filiper.eu.
  cors-origin: ""

