name: Public synthetic

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check minimal health and security headers
        shell: bash
        run: |
          set -euo pipefail
          url="https://vyprava.filiper.eu/api/health"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --dump-header "$headers" --output "$body" "$url"
          jq -e '.status == "up" and (keys | length == 1)' "$body" >/dev/null
          tr -d '\r' < "$headers" | grep -qi '^x-content-type-options: nosniff$'
          tr -d '\r' < "$headers" | grep -qi '^x-frame-options: DENY$'
          tr -d '\r' < "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin$'
          tr -d '\r' < "$headers" | grep -qi '^content-security-policy:'
